<!doctype html>
<!--
  IPME – TikTok-Weiterleitung
  TikTok leitet nach der Anmeldung hierher (Redirect URI, muss https sein).
  Die Seite reicht code und state an die App weiter: ipme://tiktok-callback?code=…&state=…
  Sie speichert nichts und lädt nichts nach.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>IPME – TikTok</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 17px/1.5 -apple-system, system-ui, sans-serif; margin: 48px 24px; background: #fff; color: #1c1c1e; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f2f2f7; } }
    a { color: #0a84ff; }
  </style>
</head>
<body>
  <p id="message">Zurück zu IPME …</p>
  <script>
    var target = "ipme://tiktok-callback" + window.location.search;
    window.location.replace(target);
    // Fallback if the app does not open by itself.
    setTimeout(function () {
      var message = document.getElementById("message");
      message.textContent = "Falls IPME nicht von selbst aufgeht: ";
      var link = document.createElement("a");
      link.href = target;
      link.textContent = "hier tippen";
      message.appendChild(link);
    }, 1500);
  </script>
</body>
</html>
